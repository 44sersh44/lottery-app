name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev gettext automake autopoint
          pip install buildozer cython kivy
      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Lottery Predictor
          package.name = lottery
          package.domain = org.robotcompru
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE
          android.api = 34
          android.minapi = 24
          android.ndk_api = 24
          android.accept_sdk_license = True
          android.enable_androidx = True
          android.archs = arm64-v8a, armeabi-v7a
          android.allow_backup = True
          android.debug_artifact = apk
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
      - name: Build APK
        run: echo y | buildozer android debug deploy run
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: lottery-apk
          path: bin/*.apk
